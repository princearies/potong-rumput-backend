name = "potong-rumput-backend"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "potong-rumput-db"
database_id = "f7d0b57c-74c8-4e35-b058-d8bbd62d32ca"
migrations_dir = "migrations"

[env.production]
name = "potong-rumput-backend"

[env.production.vars]
WHATSAPP_TOKEN = "REPLACE_WITH_WHATSAPP_ACCESS_TOKEN"
WHATSAPP_PHONE_ID = "REPLACE_WITH_WHATSAPP_PHONE_NUMBER_ID"
PROVIDER_WHATSAPP_NUMBER = "60123456789"

[[env.production.d1_databases]]
binding = "DB"
database_name = "potong-rumput-db"
database_id = "f7d0b57c-74c8-4e35-b058-d8bbd62d32ca"
migrations_dir = "migrations"
